version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: german_tax_postgres
    environment:
      POSTGRES_DB: german_tax
      POSTGRES_USER: tax_user
      POSTGRES_PASSWORD: tax_password_local_only
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgvector_data:
